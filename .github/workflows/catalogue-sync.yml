name: Catalogue sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Export registry payload
        run: node scripts/export-registry.mjs > /tmp/catalogue-payload.json

      - name: Require sync role ARN
        run: |
          if [ -z "${{ vars.CATALOGUE_SYNC_ROLE_ARN }}" ]; then
            echo "Set repository variable CATALOGUE_SYNC_ROLE_ARN to the johna-kiwi-infra output catalogue_guides_sync_role_arn"
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.CATALOGUE_SYNC_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Invoke catalogue Lambda
        run: |
          aws lambda invoke \
            --function-name johna-kiwi-catalogue \
            --cli-binary-format raw-in-base64-out \
            --payload fileb:///tmp/catalogue-payload.json \
            /tmp/catalogue-out.json
          cat /tmp/catalogue-out.json
          python3 -c 'import json,sys; d=json.load(open("/tmp/catalogue-out.json")); sys.exit(0 if d.get("ok") else 1)'
